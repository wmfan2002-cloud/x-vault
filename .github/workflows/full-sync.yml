name: full-sync

# 全量数据深度刷新。
#   - workflow_dispatch: 由管理台 POST /api/admin/trigger-action 派发
#   - schedule: 每天跑一次, 用非整点分钟以避开全网 cron 高峰
#
# 为什么不在 Worker 里跑: 332 人 × (查询 + 两张图) 远超 Workers 的 CPU/时长限额。
# 见 _reference/spec/05-sync-pipeline.md §10。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '刷新范围'
        required: false
        default: 'full'
        type: choice
        options: [full, tombstone-only, media-only]
  schedule:
    - cron: '23 19 * * *'   # UTC 19:23 ≈ 北京时间 03:23

concurrency:
  group: full-sync
  cancel-in-progress: false

permissions:
  contents: write   # 需要提交重新生成的快照

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 全量刷新 (抓取 → diff → 媒体归档 → UPSERT → history)
        env:
          X_CT0: ${{ secrets.X_CT0 }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode || 'full' }}
        run: node scripts/full-sync.mjs --mode="$MODE"

      - name: 重新生成静态快照
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/generate-snapshot.mjs --remote

      - name: 提交快照
        run: |
          git config user.name  'x-vault-bot'
          git config user.email 'x-vault-bot@users.noreply.github.com'
          if git diff --quiet -- public/data/archive.json; then
            echo '快照无变化, 跳过提交'
          else
            git add public/data/archive.json
            git commit -m "chore(snapshot): 全量刷新 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
